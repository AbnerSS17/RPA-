<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Como Instalar o RPA — RPA Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background-color: #020617; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl relative space-y-6">
        
        <!-- CABEÇALHO COM CONTROLES DE ADMIN -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div class="flex items-center gap-3">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 text-white shadow-lg">
                    <i data-lucide="book-open" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white">Guia: Como <span class="text-blue-500">Instalar</span> o RPA</h1>
                    <p class="text-xs text-slate-400">Passo a passo atualizado para novos dispositivos</p>
                </div>
            </div>
            <!-- Botão Adicionar Passo (Visível apenas para Admin) -->
            <button id="btn-add-passo" onclick="adicionarPasso()" class="hidden px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold shadow transition items-center gap-1.5 cursor-pointer">
                <i data-lucide="plus" class="w-4 h-4"></i> Adicionar Passo
            </button>
        </div>

        <!-- LISTA DINÂMICA DE PASSOS -->
        <div id="lista-passos" class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
            <div class="text-center text-xs text-slate-500 py-4">A carregar passos do guia...</div>
        </div>

        <!-- CONTAINER PADRÃO DE DOWNLOAD E VOLTAR -->
        <div class="flex flex-col sm:flex-row gap-3 pt-4 border-t border-slate-800">
            <button onclick="verificarEExecutarDownload()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl text-sm shadow-lg transition flex items-center justify-center gap-2 cursor-pointer">
                <i data-lucide="download" class="w-4 h-4"></i> Instalar
            </button>
            <a href="baixar_rpa.html" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl text-sm transition flex items-center justify-center">
                Voltar
            </a>
            <a href="index.html" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl text-sm transition flex items-center justify-center">
                Início
            </a>
        </div>
    </div>

    <script>
        let supabaseClient = window.supabaseClient;
        let isAdmin = false;
        let passosData = [];

        async function verificarPerfilAdmin() {
            const simulatedVision = localStorage.getItem('simulated_vision');
            if (simulatedVision === 'user') {
                isAdmin = false;
                document.getElementById('btn-add-passo').classList.add('hidden');
                document.getElementById('btn-add-passo').classList.remove('flex');
                return;
            }

            const sessionData = localStorage.getItem('user_session') || sessionStorage.getItem('user_session');
            if (sessionData) {
                try {
                    const user = JSON.parse(sessionData);
                    const perfil = (user.perfil || user.role || '').toUpperCase();
                    if (perfil === 'ADMIN') {
                        isAdmin = true;
                        document.getElementById('btn-add-passo').classList.remove('hidden');
                        document.getElementById('btn-add-passo').classList.add('flex');
                    }
                } catch (e) {}
            }
        }

        async function verificarEExecutarDownload() {
            if (!supabaseClient) {
                alert("Sem executável para baixar no momento.");
                return;
            }

            try {
                const { data: files, error } = await supabaseClient.storage
                    .from('executavel')
                    .list('', { limit: 10, sortBy: { column: 'updated_at', order: 'desc' } });

                const arquivoValido = files ? files.find(f => f.name !== '.emptyFolderPlaceholder') : null;

                if (!error && arquivoValido) {
                    const { data: publicUrlData } = supabaseClient.storage
                        .from('executavel')
                        .getPublicUrl(arquivoValido.name);

                    if (publicUrlData && publicUrlData.publicUrl) {
                        window.open(publicUrlData.publicUrl, '_blank');
                        return;
                    }
                }
                alert("Sem executável para baixar no momento.");
            } catch (e) {
                alert("Sem executável para baixar no momento.");
            }
        }

        async function carregarPassos() {
            if (!supabaseClient) return;
            const { data, error } = await supabaseClient
                .from('guia_passos_rpa')
                .select('*')
                .eq('tipo_guia', 'instalar')
                .order('ordem', { ascending: true });

            if (!error && data) {
                passosData = data;
                renderizarPassos();
            }
        }

        function renderizarPassos() {
            const container = document.getElementById('lista-passos');
            container.innerHTML = '';

            if (passosData.length === 0) {
                container.innerHTML = '<div class="text-center text-xs text-slate-500 py-4">Nenhum passo cadastrado.</div>';
                return;
            }

            passosData.forEach((passo, index) => {
                const numeroSequencial = index + 1;
                const div = document.createElement('div');
                div.className = "bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3 text-xs text-slate-300 relative group";

                let htmlContent = `
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-center gap-2">
                            <span class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold shrink-0 text-xs">${numeroSequencial}</span>
                            <span class="font-semibold text-slate-200">Passo ${numeroSequencial}</span>
                        </div>
                `;

                if (isAdmin) {
                    htmlContent += `
                        <button onclick="apagarPasso(${passo.id})" class="text-rose-400 hover:text-rose-300 p-1 rounded transition cursor-pointer" title="Apagar este passo">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    `;
                }

                htmlContent += `</div>`;

                if (isAdmin) {
                    htmlContent += `
                        <textarea onchange="atualizarTexto(${passo.id}, this.value)" placeholder="Digite a instrução deste passo..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-blue-500 resize-y min-h-[50px]">${passo.texto || ''}</textarea>
                    `;
                } else if (passo.texto) {
                    htmlContent += `<p class="text-slate-300 pl-8">${passo.texto}</p>`;
                }

                if (passo.imagem_url) {
                    htmlContent += `
                        <div class="pl-8 pt-1">
                            <img src="${passo.imagem_url}" alt="Ilustração Passo ${numeroSequencial}" class="rounded-lg max-h-48 border border-slate-800 object-cover">
                        </div>
                    `;
                }

                if (isAdmin) {
                    htmlContent += `
                        <div class="pl-8 pt-1 flex items-center gap-2">
                            <label class="cursor-pointer px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-[11px] font-medium border border-slate-700 transition flex items-center gap-1.5">
                                <i data-lucide="image" class="w-3.5 h-3.5 text-blue-400"></i> ${passo.imagem_url ? 'Trocar Imagem' : 'Adicionar Imagem'}
                                <input type="file" accept="image/*" class="hidden" onchange="uploadImagem(${passo.id}, event)">
                            </label>
                            ${passo.imagem_url ? `<button onclick="removerImagem(${passo.id})" class="text-rose-400 hover:text-rose-300 text-[11px] underline">Remover imagem</button>` : ''}
                        </div>
                    `;
                }

                div.innerHTML = htmlContent;
                container.appendChild(div);
            });

            if (window.lucide) lucide.createIcons();
        }

        async function adicionarPasso() {
            if (!isAdmin) return;
            const novaOrdem = passosData.length + 1;
            const { error } = await supabaseClient
                .from('guia_passos_rpa')
                .insert([{ tipo_guia: 'instalar', ordem: novaOrdem, texto: '', imagem_url: null }]);

            if (!error) carregarPassos();
        }

        async function apagarPasso(id) {
            if (!isAdmin) return;
            if (!confirm("Tem certeza que deseja apagar este passo?")) return;
            const { error } = await supabaseClient
                .from('guia_passos_rpa')
                .delete()
                .eq('id', id);

            if (!error) carregarPassos();
        }

        async function atualizarTexto(id, novoTexto) {
            if (!isAdmin) return;
            await supabaseClient
                .from('guia_passos_rpa')
                .update({ texto: novoTexto })
                .eq('id', id);
        }

        async function uploadImagem(id, event) {
            if (!isAdmin) return;
            const file = event.target.files[0];
            if (!file) return;

            const fileExt = file.name.split('.').pop();
            const fileName = `instalar_${id}_${Date.now()}.${fileExt}`;
            const filePath = `${fileName}`;

            const { error: uploadError } = await supabaseClient.storage
                .from('imagens_rpa')
                .upload(filePath, file);

            if (uploadError) {
                alert("Erro ao fazer upload da imagem.");
                return;
            }

            const { data: publicURLData } = supabaseClient.storage
                .from('imagens_rpa')
                .getPublicUrl(filePath);

            const imageUrl = publicURLData.publicUrl;

            await supabaseClient
                .from('guia_passos_rpa')
                .update({ imagem_url: imageUrl })
                .eq('id', id);

            carregarPassos();
        }

        async function removerImagem(id) {
            if (!isAdmin) return;
            if (!confirm("Deseja remover a imagem deste passo?")) return;
            await supabaseClient
                .from('guia_passos_rpa')
                .update({ imagem_url: null })
                .eq('id', id);

            carregarPassos();
        }

        document.addEventListener("DOMContentLoaded", async function() {
            await verificarPerfilAdmin();
            await carregarPassos();
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>
</html>
