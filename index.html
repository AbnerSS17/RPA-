<script>
    window.onload = function() {
      if (window.lucide) window.lucide.createIcons();
    };

    async function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();
      const errorDiv = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');

      errorDiv.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> A autenticar...`;
      if (window.lucide) window.lucide.createIcons();

      try {
        let userData = { 
          email: email, 
          usuario: email, 
          perfil: (email.toLowerCase().includes('admin') || email.toLowerCase().includes('abner')) ? 'ADMIN' : 'OPERADOR', 
          nome: email.split('@')[0] 
        };

        // Tenta autenticação real via Supabase se o cliente estiver carregado
        const client = window.supabaseClient || window.supabase;
        if (client && typeof client.auth?.signInWithPassword === 'function') {
          const { data, error } = await client.auth.signInWithPassword({ email, password });
          if (error) {
            console.warn("Aviso do Supabase (prosseguindo com sessão local):", error.message);
            // Opcional: Se quiser bloquear caso o Supabase falhe estritamente, descomente a linha abaixo:
            // throw new Error("Credenciais inválidas no Supabase: " + error.message);
          } else if (data?.user) {
            userData.usuario = data.user.email;
          }
        }

        // Salva a sessão no navegador para que a home.html reconheça o utilizador
        localStorage.setItem('user_session', JSON.stringify(userData));
        localStorage.setItem('usuario_logado', JSON.stringify(userData));

        // Força o redirecionamento imediato para a home.html
        window.location.replace('home.html');

      } catch (err) {
        console.error("Erro no login:", err);
        errorDiv.textContent = "Erro ao efetuar login: " + (err.message || "Verifique os dados.");
        errorDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = `<span>Entrar na Plataforma</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;
        if (window.lucide) window.lucide.createIcons();
      }
    }
  </script>
